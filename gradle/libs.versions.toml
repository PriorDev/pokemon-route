[versions]
accompanistSystemuicontrollerVersion = "0.30.0"
activityComposeVersion = "1.9.2"
apolloRuntimeVersion = "3.7.3"
coilComposeVersion = "2.6.0"
coreKtxVersion = "1.13.1"
espressoCoreVersion = "3.6.1"
gsonVersion = "2.10.1"
junitVersion = "1.2.1"
koinAndroidVersion = "3.3.0"
kotlinVersion = "2.0.0"
compose_ui_version = "1.7.2"
kotlinxCoroutinesTestVersion = "1.7.1"
lifecycleRuntimeKtx = "2.8.6"
lifecycleRuntimeKtxVersion = "2.8.6"
material3Version = "1.3.0"
materialVersion = "1.7.2"
navigationComposeVersion = "2.8.4"
pagingRuntimeKtxVersion = "3.3.2"
paletteVersion = "1.0.0"
roomKtxVersion = "2.6.1"
serialization = "1.6.3"
ktor = "2.0.1"
jupiter = '5.9.3'

[libraries]
apollo-runtime = { module = "com.apollographql.apollo3:apollo-runtime", version.ref = "apolloRuntimeVersion" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koinAndroidVersion" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koinAndroidVersion" }
koin-androidx-navigation = { module = "io.insert-koin:koin-androidx-navigation", version.ref = "koinAndroidVersion" }
koin-test-junit4 = { module = "io.insert-koin:koin-test-junit4", version.ref = "koinAndroidVersion" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization"}
accompanist-systemuicontroller = { module = "com.google.accompanist:accompanist-systemuicontroller", version.ref = "accompanistSystemuicontrollerVersion" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityComposeVersion" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilComposeVersion" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtxVersion" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCoreVersion" }
ext-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
google-service = "com.google.gms:google-services:4.4.2"
gradle = "com.android.tools.build:gradle:8.7.3"
gson = { module = "com.google.code.gson:gson", version.ref = "gsonVersion" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlinVersion"}

composeUi = { module = "androidx.compose.ui:ui", version.ref = "compose_ui_version"}
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose_ui_version"}
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor"}
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor"}
ktor-client-serialization = { module = "io.ktor:ktor-client-serialization", version.ref = "ktor"}
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor"}
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor"}
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtxVersion" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
material = { module = "androidx.compose.material:material", version.ref = "materialVersion" }
material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose_ui_version" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3Version" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationComposeVersion" }
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "pagingRuntimeKtxVersion" }
paging-runtime-ktx = { module = "androidx.paging:paging-runtime-ktx", version.ref = "pagingRuntimeKtxVersion" }
palette = { module = "androidx.palette:palette", version.ref = "paletteVersion" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomKtxVersion" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "roomKtxVersion" }
room-paging = { module = "androidx.room:room-paging", version.ref = "roomKtxVersion" }
ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose_ui_version"}
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose_ui_version"}

junit = "junit:junit:4.13.2"

detekt-formatting = "io.gitlab.arturbosch.detekt:detekt-formatting:1.23.6"
detekt-cli = "io.gitlab.arturbosch.detekt:detekt-cli:1.23.6"
detekt-rules-compose = "ru.kode:detekt-rules-compose:1.3.0"

#Test
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "jupiter"}
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "jupiter"}
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "jupiter" }
compose-test-junit = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose_ui_version"}
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTestVersion" }
mockk = { module = "io.mockk:mockk", version = "1.12.5"}
mockk-android = { module = "io.mockk:mockk-android", version = "1.12.5"}
assertk = "com.willowtreeapps.assertk:assertk:0.26.1"
turbine = "app.cash.turbine:turbine:0.7.0"

[bundles]
detekt = ["detekt-formatting", "detekt-cli", "detekt-rules-compose"]

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinVersion" }
org-jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlinVersion" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinVersion" }
