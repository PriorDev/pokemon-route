[versions]
kotlinVersion = "1.6.10"
hiltVersion = "2.42"
compose_ui_version = "1.2.0"

[libraries]
google-service = "com.google.gms:google-services:4.3.15"
gradle = "com.android.tools.build:gradle:4.1.3"
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlinVersion"}
dagger-hilt = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hiltVersion"}

composeUi = { module = "androidx.compose.ui:ui", version.ref = "compose_ui_version"}
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose_ui_version"}
compose-test-junit = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose_ui_version"}
ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose_ui_version"}
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose_ui_version"}

dagger-hitl = { module = "com.google.dagger:hilt-android", version.ref = "hiltVersion"}
dagger-hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hiltVersion" }

junit = "junit:junit:4.13.2"